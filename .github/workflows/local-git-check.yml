name: Local Git checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
concurrency:
  group: local-git-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: NativeBuild
          key: nativegit-1.9.7-${{ runner.arch }}-${{ hashFiles('Scripts/build_native_git.sh') }}
      - name: Build pinned native Git for macOS
        run: bash Scripts/build_native_git.sh macosx
      - name: Execute production Git bridge tests
        env:
          RP_GIT_NETWORK_SMOKE: '1'
        run: python3 Tests/test_local_git_native.py
      - name: Execute original folder and edit protection tests
        run: python3 Tests/test_local_git_store.py
      - name: Execute local page state tests
        run: python3 Tests/test_local_git_ui.py
      - name: Build native Git for iPhone
        run: bash Scripts/build_native_git.sh iphoneos
      - name: Compile and link the same production bridge for iOS 16
        run: |
          printf '#include "NativeGitBridge.h"\nint main(void) {rp_git_free(rp_git_execute("inspect", "{}"));return 0;}\n' > NativeBuild/probe.c
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I NativeBuild/iphoneos/include -I Vendor/NativeGit \
            Vendor/NativeGit/NativeGitBridge.m NativeBuild/probe.c \
            -L NativeBuild/iphoneos/lib -lgit2 -lz -liconv \
            -framework Foundation -framework Security -framework CoreFoundation \
            -o NativeBuild/ios-probe
      - name: Test home and community production models
        run: |
          python3 Tests/test_home_community.py
          python3 Tests/test_issue_deletion.py
          python3 Tests/test_repository_search_routing.py
          python3 Tests/test_release_asset_download.py
          python3 Tests/test_user_follow.py
          python3 Tests/test_file_feedback.py
          python3 Tests/test_local_file_presentation.py
          python3 Tests/test_community.py
      - name: Generate application project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile native Git integration and new SwiftUI pages
        run: |
          set -o pipefail
          xcodebuild -project RepoPocket.xcodeproj -scheme RepoPocket -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath native-app-build \
            CODE_SIGNING_ALLOWED=NO build > native-app-build.log 2>&1 || { tail -100 native-app-build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-git-compile-log
          path: native-app-build.log
