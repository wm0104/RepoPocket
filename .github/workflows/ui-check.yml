name: Native UI checks
on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Run all UI checks, profile navigation, or attachment/follow actions
        type: choice
        options: [all, profiles, actions, workflow-selection, file-feedback, download-lifecycle, file-edit, review-regressions, maintenance-regressions, branch-merge, release-editor, upload-viewer, repository-operations, repository-collections, regression-recheck, ui-fixes, ui-fixes-failed, path-time, reading-layout]
        default: all
  pull_request:
    branches: [main]
    paths:
      - RepoPocket/**
      - SharedInbox/**
      - ShareExtension/**
      - Vendor/**
      - project.yml
      - StyleUITests/**
      - Scripts/**
      - .github/workflows/ui-check.yml
concurrency:
  group: ui-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      # 三组串行，避免同一工作流同时挤占 macOS runner 容量。
      matrix:
        group: ${{ fromJSON((inputs.test_scope || 'all') == 'all' && '["boundaries-a","boundaries-b","editors"]' || '["selected"]') }}
    env:
      RP_STYLE_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
      RP_STYLE_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test community API, profile contacts and UI preflight
        run: |
          python3 Tests/test_community.py
          python3 Tests/test_social_platforms.py
          python3 Tests/test_style_failure_diagnostics.py
      - name: Test reading layout, code search and complete log rules
        if: inputs.test_scope == 'reading-layout'
        run: |
          python3 Tests/test_reading_density_refresh.py
          python3 Tests/test_repository_search_routing.py
          python3 Tests/test_workflow_log_presentation.py
          python3 Tests/test_source_text_search.py
          python3 Tests/test_workspace_zip.py
      - name: Test path-time formatter and compact navigation
        if: inputs.test_scope == 'path-time'
        run: |
          python3 Tests/test_path_commit_metadata.py
          python3 Tests/test_compact_directory_rows.py
      - uses: actions/cache@v4
        with:
          path: NativeBuild
          key: nativegit-1.9.7-${{ runner.arch }}-${{ hashFiles('Scripts/build_native_git.sh', 'Scripts/patch_native_git.py') }}
      - name: Build real simulator application
        run: |
          set -euo pipefail
          bash Scripts/build_native_git.sh iphonesimulator
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project RepoPocket.xcodeproj -scheme RepoPocket -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath preview-build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build 2>&1 | tee preview-build.log
      - name: Show compiler diagnostics
        if: failure()
        run: |
          grep -n ': error:' preview-build.log | head -40 || tail -100 preview-build.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.group == 'selected' && 'preview-build-log' || format('preview-build-log-{0}', matrix.group) }}
          path: preview-build.log
          retention-days: 7
      - name: Exercise shipping local Git and code surfaces
        run: bash Scripts/run_style_preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.group == 'selected' && 'simulator-style-preview' || format('simulator-style-preview-{0}', matrix.group) }}
          path: |
            screenshots/*.png
            screenshots/*.mp4
            local-git-recording.log
            preview-build.log
            style-test-build.log
            app-preview.log
            preview-crashes/**
            preview-linkage.log
            preview-launch-help.log
            style-tests.log
            style-tests.xcresult
