name: Native UI checks
on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Run all UI checks, profile navigation, or attachment/follow actions
        type: choice
        options: [all, profiles, actions, workflow-selection, file-feedback, download-lifecycle]
        default: all
  push:
    branches: [main, 'codex/**']
    paths:
      - RepoPocket/**
      - SharedInbox/**
      - ShareExtension/**
      - Vendor/**
      - project.yml
      - StyleUITests/**
      - Scripts/**
      - .github/workflows/ui-check.yml
  pull_request:
    branches: [main]
    paths:
      - RepoPocket/**
      - SharedInbox/**
      - ShareExtension/**
      - Vendor/**
      - project.yml
      - StyleUITests/**
      - Scripts/**
      - .github/workflows/ui-check.yml
concurrency:
  group: ui-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      RP_STYLE_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - uses: actions/cache@v4
        with:
          path: NativeBuild
          key: nativegit-1.9.7-${{ runner.arch }}-${{ hashFiles('Scripts/build_native_git.sh') }}
      - name: Build real simulator application
        run: |
          set -euo pipefail
          bash Scripts/build_native_git.sh iphonesimulator
          brew install xcodegen
          xcodegen generate
          xcodebuild -project RepoPocket.xcodeproj -scheme RepoPocket -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath preview-build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build > preview-build.log 2>&1 || { tail -100 preview-build.log; exit 1; }
      - name: Exercise shipping local Git and code surfaces
        run: bash Scripts/run_style_preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-style-preview
          path: |
            screenshots/*.png
            screenshots/*.mp4
            local-git-recording.log
            preview-build.log
            style-test-build.log
            app-preview.log
            style-tests.log
            style-tests.xcresult
