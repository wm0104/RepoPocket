name: RepoPocket
options:
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
  bundleIdPrefix: com.wm0104
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: Vendor/DebCodecs/DebCodecs.h
    HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/DebCodecs/xz"
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) XZ_USE_CRC64 XZ_USE_SHA256"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "6"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  RepoPocket:
    dependencies:
      - package: ZIPFoundation
    type: application
    platform: iOS
    sources: [RepoPocket, Vendor/DebCodecs]
    info:
      path: RepoPocket/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDisplayName: RepoPocket
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.RepoPocket
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: RepoPocket
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
schemes:
  RepoPocket:
    build:
      targets:
        RepoPocket: all
