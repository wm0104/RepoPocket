name: RepoPocket
options:
  projectFormat: xcode15_3
  xcodeVersion: "15.4"
  bundleIdPrefix: com.wm0104
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: Vendor/DebCodecs/DebCodecs.h
    HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/DebCodecs/xz"
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) XZ_USE_CRC64 XZ_USE_SHA256"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "13"
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
  NetworkImage:
    url: https://github.com/gonzalezreal/NetworkImage.git
    exactVersion: 6.0.0
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.4.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    exactVersion: 1.12.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  RepoPocket:
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: ZIPFoundation
      - target: RepoPocketShare
        embed: true
    type: application
    platform: iOS
    sources: [RepoPocket, Vendor/DebCodecs, Vendor/NativeGit, SharedInbox]
    info:
      path: RepoPocket/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDisplayName: RepoPocket
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationQueriesSchemes:
          - apple-magnifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.RepoPocket
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: RepoPocket
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/NativeBuild/$(PLATFORM_NAME)/include"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/NativeBuild/$(PLATFORM_NAME)/lib"
        OTHER_LDFLAGS: "$(inherited) -lgit2 -lz -liconv -framework Security -framework CoreFoundation"
  RepoPocketShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, SharedInbox]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: RepoPocket
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule: "SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO 'public.item').@count > 0).@count > 0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.RepoPocket.Share
        SWIFT_OBJC_BRIDGING_HEADER: ""
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  RepoPocketStyleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StyleUITests]
    dependencies:
      - target: RepoPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wm0104.RepoPocketStyleUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
        TEST_TARGET_NAME: RepoPocket
schemes:
  RepoPocket:
    build:
      targets:
        RepoPocket: all
    test:
      targets:
        - RepoPocketStyleUITests
